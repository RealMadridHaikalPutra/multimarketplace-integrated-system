[pytest]
asyncio_mode = strict
# test_stock_sync_manual_part.py is a WIP test that ALSO fails to collect in the
# reference project: it imports DTOs (StockSyncManualPartResponse,
# StockSyncPartScopeResponse) and pipeline symbols (PartScope, _retry_source_for,
# TRIGGER_SOURCE_MANUAL_PART*) that do not exist in any source file — for a
# `/stock-sync/run-part` feature that was never implemented. Excluded so the rest
# of the suite is runnable; see docs/refactor/00-overview.md ("Status").
addopts = --ignore=tests/test_stock_sync_manual_part.py
